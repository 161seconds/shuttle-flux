services:
  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://user:password@postgres:5432/badminton_ai
      - INFERENCE_SERVICE_URL=http://inference:5001
    depends_on:
      - redis
      - postgres
      - inference

  inference:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.inference
    ports:
      - "5001:5001"
    environment:
      - VISION_BACKEND=auto
      - YOLO_MODEL_PATH=/app/yolov8n.pt
      - ENABLE_SAM3=0
      - ENABLE_OSNET=0
    volumes:
      - ../../models:/app/models

  worker:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://user:password@postgres:5432/badminton_ai
      - INFERENCE_SERVICE_URL=http://inference:5001
      - ENABLE_FFMPEG_NORMALIZATION=1
    depends_on:
      - redis
      - postgres
      - inference
    volumes:
      - ../../models:/app/models

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: badminton_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
